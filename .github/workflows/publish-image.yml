name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      wp_version:
        description: Override WP_VERSION for this run
        required: false
        type: string
      php_version:
        description: Override PHP_VERSION for this run
        required: false
        type: string
      node_version:
        description: Override NODE_VERSION for this run
        required: false
        type: string
      app_user:
        description: Override APP_USER for this run
        required: false
        type: string
      app_uid:
        description: Override APP_UID for this run
        required: false
        type: string
      app_gid:
        description: Override APP_GID for this run
        required: false
        type: string
      claude_code_version:
        description: Override CLAUDE_CODE_VERSION for this run (use none to disable)
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build variables (.env defaults, GitHub overrides)
        id: vars
        env:
          INPUT_WP_VERSION: ${{ github.event.inputs.wp_version }}
          INPUT_PHP_VERSION: ${{ github.event.inputs.php_version }}
          INPUT_NODE_VERSION: ${{ github.event.inputs.node_version }}
          INPUT_APP_USER: ${{ github.event.inputs.app_user }}
          INPUT_APP_UID: ${{ github.event.inputs.app_uid }}
          INPUT_APP_GID: ${{ github.event.inputs.app_gid }}
          INPUT_CLAUDE_CODE_VERSION: ${{ github.event.inputs.claude_code_version }}
          VAR_WP_VERSION: ${{ vars.WP_VERSION }}
          VAR_PHP_VERSION: ${{ vars.PHP_VERSION }}
          VAR_NODE_VERSION: ${{ vars.NODE_VERSION }}
          VAR_APP_USER: ${{ vars.APP_USER }}
          VAR_APP_UID: ${{ vars.APP_UID }}
          VAR_APP_GID: ${{ vars.APP_GID }}
          VAR_CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
        run: |
          get_default_from_env() {
            local key="$1"
            grep -E "^${key}=" .env | tail -n 1 | cut -d'=' -f2-
          }

          resolve_value() {
            local key="$1"
            local input_value="$2"
            local var_value="$3"
            local current_value="${!key:-}"
            local env_default
            env_default="$(get_default_from_env "$key")"

            local resolved="$input_value"
            if [ -z "$resolved" ]; then
              resolved="$current_value"
            fi
            if [ -z "$resolved" ]; then
              resolved="$var_value"
            fi
            if [ -z "$resolved" ]; then
              resolved="$env_default"
            fi

            echo "${key}=${resolved}" >> "$GITHUB_ENV"
            echo "$(echo "$key" | tr '[:upper:]' '[:lower:]')=${resolved}" >> "$GITHUB_OUTPUT"
          }

          resolve_value "WP_VERSION" "$INPUT_WP_VERSION" "$VAR_WP_VERSION"
          resolve_value "PHP_VERSION" "$INPUT_PHP_VERSION" "$VAR_PHP_VERSION"
          resolve_value "NODE_VERSION" "$INPUT_NODE_VERSION" "$VAR_NODE_VERSION"
          resolve_value "APP_USER" "$INPUT_APP_USER" "$VAR_APP_USER"
          resolve_value "APP_UID" "$INPUT_APP_UID" "$VAR_APP_UID"
          resolve_value "APP_GID" "$INPUT_APP_GID" "$VAR_APP_GID"
          resolve_value "CLAUDE_CODE_VERSION" "$INPUT_CLAUDE_CODE_VERSION" "$VAR_CLAUDE_CODE_VERSION"

      - name: Validate build variables
        run: |
          if [ -z "$WP_VERSION" ]; then
            echo "::error::WP_VERSION is empty. Check .env and workflow variable loading."
            exit 1
          fi
          if [ -z "$PHP_VERSION" ]; then
            echo "::error::PHP_VERSION is empty. Check .env and workflow variable loading."
            exit 1
          fi
          if [ -z "$NODE_VERSION" ]; then
            echo "::error::NODE_VERSION is empty. Check .env and workflow variable loading."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker Hub credentials
        id: auth
        env:
          SECRET_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VAR_DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          USERNAME="$SECRET_DOCKERHUB_USERNAME"
          if [ -z "$USERNAME" ]; then
            USERNAME="$VAR_DOCKERHUB_USERNAME"
          fi

          if [ -z "$USERNAME" ]; then
            echo "::error::Missing Docker Hub username. Set DOCKERHUB_USERNAME as a repository secret or variable."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ] && [ -z "$DOCKERHUB_PASSWORD" ]; then
            echo "::error::Missing Docker Hub credential. Set DOCKERHUB_TOKEN (preferred) or DOCKERHUB_PASSWORD."
            exit 1
          fi

          if [ -n "$DOCKERHUB_TOKEN" ]; then
            AUTH_SECRET="$DOCKERHUB_TOKEN"
            AUTH_MODE="token"
          else
            AUTH_SECRET="$DOCKERHUB_PASSWORD"
            AUTH_MODE="password"
          fi

          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$AUTH_SECRET" >> "$GITHUB_OUTPUT"
          echo "mode=$AUTH_MODE" >> "$GITHUB_OUTPUT"

      - name: Auth mode
        run: |
          echo "Using Docker Hub auth mode: ${{ steps.auth.outputs.mode }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.auth.outputs.username }}
          password: ${{ steps.auth.outputs.password }}

      - name: Generate Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: viwiv/wp-dev
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.wp_version }}-php${{ steps.vars.outputs.php_version }}-apache-node${{ steps.vars.outputs.node_version }}
            type=raw,value=${{ steps.vars.outputs.wp_version }}-php${{ steps.vars.outputs.php_version }}-node${{ steps.vars.outputs.node_version }}
            type=raw,value=${{ steps.vars.outputs.wp_version }}-php${{ steps.vars.outputs.php_version }}-apache

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ steps.vars.outputs.node_version }}
            PHP_VERSION=${{ steps.vars.outputs.php_version }}
            WP_VERSION=${{ steps.vars.outputs.wp_version }}
            APP_USER=${{ steps.vars.outputs.app_user }}
            APP_UID=${{ steps.vars.outputs.app_uid }}
            APP_GID=${{ steps.vars.outputs.app_gid }}
            CLAUDE_CODE_VERSION=${{ steps.vars.outputs.claude_code_version }}
