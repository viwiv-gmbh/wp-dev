name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load build variables from .env
        run: |
          set -a
          source .env
          set +a

          echo "NODE_VERSION=${NODE_VERSION}" >> "$GITHUB_ENV"
          echo "PHP_VERSION=${PHP_VERSION}" >> "$GITHUB_ENV"
          echo "WP_VERSION=${WP_VERSION}" >> "$GITHUB_ENV"
          echo "APP_USER=${APP_USER}" >> "$GITHUB_ENV"
          echo "APP_UID=${APP_UID}" >> "$GITHUB_ENV"
          echo "APP_GID=${APP_GID}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker Hub credentials
        id: auth
        env:
          SECRET_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VAR_DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          USERNAME="$SECRET_DOCKERHUB_USERNAME"
          if [ -z "$USERNAME" ]; then
            USERNAME="$VAR_DOCKERHUB_USERNAME"
          fi

          if [ -z "$USERNAME" ]; then
            echo "::error::Missing Docker Hub username. Set DOCKERHUB_USERNAME as a repository secret or variable."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ] && [ -z "$DOCKERHUB_PASSWORD" ]; then
            echo "::error::Missing Docker Hub credential. Set DOCKERHUB_TOKEN (preferred) or DOCKERHUB_PASSWORD."
            exit 1
          fi

          if [ -n "$DOCKERHUB_TOKEN" ]; then
            AUTH_SECRET="$DOCKERHUB_TOKEN"
            AUTH_MODE="token"
          else
            AUTH_SECRET="$DOCKERHUB_PASSWORD"
            AUTH_MODE="password"
          fi

          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$AUTH_SECRET" >> "$GITHUB_OUTPUT"
          echo "mode=$AUTH_MODE" >> "$GITHUB_OUTPUT"

      - name: Auth mode
        run: echo "Using Docker Hub auth mode: ${{ steps.auth.outputs.mode }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.auth.outputs.username }}
          password: ${{ steps.auth.outputs.password }}

      - name: Generate Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: viwiv/wp-dev
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{env.WP_VERSION}}-php{{env.PHP_VERSION}}-apache-node{{env.NODE_VERSION}}
            type=raw,value={{env.WP_VERSION}}-php{{env.PHP_VERSION}}-node{{env.NODE_VERSION}}
            type=raw,value={{env.WP_VERSION}}-php{{env.PHP_VERSION}}-apache

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            PHP_VERSION=${{ env.PHP_VERSION }}
            WP_VERSION=${{ env.WP_VERSION }}
            APP_USER=${{ env.APP_USER }}
            APP_UID=${{ env.APP_UID }}
            APP_GID=${{ env.APP_GID }}
