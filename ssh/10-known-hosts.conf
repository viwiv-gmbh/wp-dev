# Installed by the wp-dev image to /etc/ssh/ssh_config.d/10-known-hosts.conf
#
# Home directories are often mounted read-only into the container
# (e.g. lima-... on /root/.ssh type virtiofs (ro,relatime)), so ssh cannot
# append accepted host keys to ~/.ssh/known_hosts:
#   tee: /root/.ssh/known_hosts: Read-only file system
# Consequence: the host key confirmation prompt returns in every new session.
#
# Fix: point ssh at a writable known_hosts outside the read-only mount. ssh
# writes new entries to the FIRST file listed, so /var/lib/ssh/known_hosts must
# stay first; ~/.ssh/known_hosts remains readable for keys supplied by the host.
Host *
    UserKnownHostsFile /var/lib/ssh/known_hosts ~/.ssh/known_hosts
    GlobalKnownHostsFile /etc/ssh/ssh_known_hosts
